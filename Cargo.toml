[workspace]
resolver = "2"
members = [
  "crates/sandikala-core",
  "crates/sandikala-io",
  "crates/sandikala-engine",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
atomicwrites = "=0.4.4"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
cpal = "=0.16.0"
rustysynth = "=1.3.7"
